 var rows=shown.map(function(i){var a=S.apps[i];return "<tr><td><b>"+esc(a.company)+"</b><br><span class='mut'>"+esc(a.role)+(a.location?" · "+esc(a.location):"")+"</span>"+(a.jd?scChip(a):"")+"</td><td><select data-st='"+i+"'>"+ST.map(function(s){return "<option"+(s===a.status?" selected":"")+">"+s+"</option>"}).join("")+"</select>"+(stale(a)?"<br><span class='warn mut'>No update in 14+ days: follow up</span>":"")+"</td><td class='mut'>"+day(a.applied)+"</td><td class='mut'>"+((a.emails||[]).length?(a.emails.length+" email"+(a.emails.length>1?"s":"")):"")+"</td><td><button class='btn sm' data-open='"+i+"'>Open</button></td></tr>"}).join("");
 var h="<div class='card'><div>"+stats+"</div><div class='row'><input id='q' placeholder='Search company or role' value='"+esc(S.q)+"'><select id='fs'><option>All</option>"+SC.map(function(s){return "<option"+(F0===s?" selected":"")+">"+s+"</option>"}).join("")+"</select></div><div class='wrap'><table><tr><th>Job</th><th>Status</th><th>Applied</th><th>Mail</th><th></th></tr>"+(rows||"<tr><td colspan=5 class='mut'>"+(sc==="saved"?"Nothing saved yet. Swipe right on a job, or use Add job.":"Nothing applied yet. Change a saved job’s status to Applied.")+"</td></tr>")+"</table></div></div>";
 if(S.sel&&S.apps[S.sel]){var a=S.apps[S.sel];function f(k,l,t){return "<div><label>"+l+"</label><input data-f='"+k+"' type='"+(t||"text")+"' value='"+esc(a[k])+"' style='width:100%'></div>"}
  h+="<div class='card'><h2>"+esc(a.company||"New job")+" · "+esc(a.role)+"</h2><div class='g2'>"+f("company","Company")+f("role","Role")+f("location","Location")+f("url","Job link")+f("applied","Applied on","date")+"<div><label>Status</label><select data-f='status' style='width:100%'>"+ST.map(function(s){return "<option"+(s===a.status?" selected":"")+">"+s+"</option>"}).join("")+"</select></div></div><label>Notes</label><textarea data-f='notes' style='min-height:70px'>"+esc(a.notes)+"</textarea><label>Job description</label><textarea data-f='jd'>"+esc(a.jd)+"</textarea>"+scBlock(a)+(a.url&&/^https?:\/\//.test(a.url)?"<p><a href='"+esc(a.url)+"' target='_blank' rel='noopener'>Open posting ↗</a></p>":"")+"<div class='row'><button class='btn pri' data-act='tailor'>Tailor resume</button><button class='btn' data-act='mail'>Check email</button><button class='btn bad' data-act='del'>Delete</button></div>"+(a.emails&&a.emails.length?"<h2>Emails found</h2>"+a.emails.map(function(m){return "<div class='mut'>"+day(Date.parse(m.date))+" · <b>"+esc(m.kind)+"</b> · "+esc(m.subject)+" <a href='"+esc(m.url)+"' target='_blank' rel='noopener'>open</a></div>"}).join(""):"")+"</div>"}
 return h}
function vAdd(){
 return "<div class='card'><h2>Add a job</h2><div class='row'><input id='nc' placeholder='Company'><input id='nr' placeholder='Role'><input id='nl' placeholder='Link (optional)'></div><div class='row'><button class='btn pri' id='addbtn'>Save job</button></div></div>"+
 "<div class='card'><h2>Capture from any job page</h2><p class='mut'>A page can’t read another site from here, so use a one-click bookmark: it runs on the job page you already have open (LinkedIn, Naukri or a company portal), copies the title, company, location, link and full description, and you paste it below.</p><ol class='mut'><li>Create a new bookmark in your browser, name it “Capture job”, and paste the code below as its URL.</li><li>On a job page, click the bookmark. It confirms the copy.</li><li>Paste here and press Add.</li></ol><label>Bookmark code</label><textarea id='bm' readonly style='min-height:90px'>"+esc(BM)+"</textarea><div class='row'><button class='btn' id='bmcopy'>Copy bookmark code</button></div><label>Paste captured job</label><textarea id='cap' placeholder='JOBCAPTURE:{...}'></textarea><div class='row'><button class='btn pri' id='capadd'>Add captured job</button></div></div>"+
 "<div class='card mut'>Tip: click the Capture bookmark on any Naukri, Indeed or LinkedIn job page, then paste here to track it with its full description. Searches live in the Find jobs tab.</div>"}
function appOpts(sel){return Object.keys(S.apps).map(function(i){var a=S.apps[i];return "<option value='"+i+"'"+(i===sel?" selected":"")+">"+esc(a.company+" · "+a.role)+"</option>"}).join("")}
function vMail(){return vInbox()+vMail0()}
function vMail0(){
 var h="<div class='card'><h2>Check specific applications</h2><p class='mut'>Searches your inbox for each company, asks Claude to classify what it finds, and suggests a status. Nothing changes until you press Apply. Read-only access.</p><div class='row'><select id='msel'><option value='*'>All active applications</option>"+appOpts("")+"</select><button class='btn pri' id='mgo'"+(S.busy?" disabled":"")+">"+(S.busy?"Scanning…":"Scan inbox")+"</button></div>"+(S.mcp?"":"<p class='warn'>Gmail access isn’t available in this view.</p>")+"</div>";
 var any=false;Object.keys(S.apps).forEach(function(i){var a=S.apps[i];if(!a.emails||!a.emails.length)return;any=true;h+="<div class='card'><h2>"+esc(a.company)+" <span class='mut'>("+esc(a.status)+")</span></h2>"+(S.scan[i]?"<p class='err mut'>"+esc(S.scan[i])+"</p>":"")+a.emails.map(function(m,k){return "<div class='row'><span class='chip'>"+esc(m.kind)+"</span><span>"+esc(m.subject)+"<br><span class='mut'>"+esc(m.sender)+" · "+day(Date.parse(m.date))+" · <a href='"+esc(m.url)+"' target='_blank' rel='noopener'>open</a></span></span>"+(m.sug&&m.sug!==a.status?"<button class='btn sm' data-ap='"+i+"|"+k+"'>Set “"+esc(m.sug)+"”</button>":"")+"</div>"}).join("")+"</div>"});
 Object.keys(S.scan).forEach(function(i){if(S.apps[i]&&(!S.apps[i].emails||!S.apps[i].emails.length)&&S.scan[i])h+="<div class='card mut'>"+esc(S.apps[i].company)+": "+esc(S.scan[i])+"</div>"});
 return h}
var BM="javascript:(function(){var t=document.title,m=document.querySelector('meta[property=\"og:site_name\"]'),s=m?m.content:location.hostname,j=null;document.querySelectorAll('script[type=\"application/ld+json\"]').forEach(function(e){try{var d=JSON.parse(e.textContent);[].concat(d['@graph']||d).forEach(function(x){if(x&&x['@type']==='JobPosting')j=x})}catch(_){}});var el=document.createElement('div');el.innerHTML=j?(j.description||''):'';var txt=j?el.textContent:((document.querySelector('main')||document.body).innerText||'');var loc=j&&j.jobLocation?JSON.stringify(j.jobLocation).replace(/[{}\\[\\]\"]/g,' ').slice(0,200):'';var o={title:j?j.title:t,company:j&&j.hiringOrganization?j.hiringOrganization.name:s,location:loc,url:location.href,jd:txt.replace(/\\s+/g,' ').slice(0,12000)};var c='JOBCAPTURE:'+JSON.stringify(o);navigator.clipboard.writeText(c).then(function(){alert('Job copied. Paste it into your tracker.')},function(){prompt('Copy this:',c)})})();";
function bind(){
 bindDeck();bindSettings();bindResume();
 var q=$("q");if(q)q.oninput=function(){S.q=q.value;var p=q.selectionStart;render();var n=$("q");n.focus();n.setSelectionRange(p,p)};
 if($("fs"))$("fs").onchange=function(){S.f=$("fs").value;render()};
 each("[data-st]",function(e){e.onchange=function(){upd(e.dataset.st,{status:e.value,applied:(e.value==="Applied"&&!S.apps[e.dataset.st].applied)?new Date().toISOString().slice(0,10):S.apps[e.dataset.st].applied})}});
 each("[data-open]",function(e){e.onclick=function(){S.sel=e.dataset.open;render();try{$("view").scrollIntoView(false)}catch(_){}}});
 each("[data-f]",function(e){e.onchange=function(){var p={};p[e.dataset.f]=e.value;upd(S.sel,p)}});
 each("[data-act]",function(e){e.onclick=function(){var k=e.dataset.act;if(k==="tailor"){S.tab="tailor";render()}else if(k==="mail"){S.tab="mail";render()}else if(k==="del"){if(e.dataset.sure){delete S.apps[S.sel];if(S.col)S.col.doc(S.sel).delete();S.sel=null;render()}else{e.dataset.sure=1;e.textContent="Click again to delete"}}}});
 if($("addbtn"))$("addbtn").onclick=function(){var c=$("nc").value.trim(),r=$("nr").value.trim();if(c||r)addApp({company:c,role:r,url:$("nl").value.trim()})};
 if($("bmcopy"))$("bmcopy").onclick=function(){var t=$("bm");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand("copy")}this.textContent="Copied ✓"};
 if($("capadd"))$("capadd").onclick=function(){var v=$("cap").value.trim().replace(/^JOBCAPTURE:/,"");try{var o=JSON.parse(v);addApp({company:o.company||"",role:o.title||"",location:o.location||"",url:o.url||"",jd:o.jd||""})}catch(e){note("That doesn’t look like a captured job. Click the bookmark on the job page again, then paste.","err")}};
 if($("msave"))$("msave").onclick=function(){S.resume=$("mres").value;if(S.col)S.col.doc("resume").set({text:S.resume}).then(function(){note("Master resume saved.","ok")}).catch(function(e){note("Could not save: "+(e&&e.code||e),"err")});else note("Saved for this session only.","warn");render()};
 if($("mgo"))$("mgo").onclick=function(){scan($("msel").value)};
 each("[data-ap]",function(e){e.onclick=function(){var p=e.dataset.ap.split("|"),a=S.apps[p[0]];upd(p[0],{status:a.emails[+p[1]].sug})}})}
function each(s,f){Array.prototype.forEach.call(document.querySelectorAll(s),f)}
async function scan(which){
 if(!S.mcp){note("Gmail access isn’t available in this view.","warn");return}
 var ids=which==="*"?Object.keys(S.apps).filter(function(i){return ["Applied","Referral asked","Screening","Interview"].indexOf(S.apps[i].status)>-1&&S.apps[i].company}).slice(0,15):[which];
 if(!ids.length){note("No active applications to scan. Set a job to Applied first.","warn");return}
 S.busy=true;S.scan={};note("Scanning your inbox…");render();
 for(var n=0;n<ids.length;n++){var id=ids[n],a=S.apps[id];if(!a)continue;
  try{var co=a.company.replace(/["]/g,"");
   var r=await S.mcp.callTool("Gmail","search_threads",{query:"\""+co+"\" (application OR interview OR assessment OR \"next steps\" OR unfortunately OR recruiter OR candidate OR role) newer_than:120d -category:promotions",pageSize:8});
   var th=(r.payload&&r.payload.threads)||[];
   var items=th.map(function(t,i){var m=(t.messages||[]).slice(-1)[0]||{};return {i:i,subject:dec(m.subject),sender:m.sender||"",snippet:dec(m.snippet).slice(0,260),date:m.date,url:t.viewUrl}});
   if(!items.length){S.scan[id]="No emails found.";continue}
   var cl=[];try{cl=await S.sample.json("Classify job-application emails for the application to "+a.company+" ("+a.role+"). For each item return {i, kind, status}. kind is one of: rejection, interview, assessment, offer, acknowledgement, recruiter, unrelated. Use unrelated if it is not about this company’s hiring process (newsletters, other companies, job alerts). status is the matching tracker status from [Screening, Interview, Offer, Rejected] or empty for acknowledgement, recruiter, unrelated; use Screening for assessment. Return a JSON array only.\n"+JSON.stringify(items.map(function(x){return {i:x.i,subject:x.subject,sender:x.sender,snippet:x.snippet}})),{modelTier:"quick"})}catch(e){S.scan[id]="Found emails but classification failed: "+sErr(e)}
   var em=items.map(function(x){var c=cl.filter(function(y){return y.i===x.i})[0]||{kind:"unclassified",status:""};return {id:th[x.i].id,subject:x.subject,sender:x.sender,date:x.date||"",url:x.url,kind:c.kind,sug:c.status||""}}).filter(function(x){return x.kind!=="unrelated"});
   if(!em.length)S.scan[id]="Only unrelated emails found.";
   var o=Object.assign({},S.apps[id],{emails:em,mailChecked:Date.now()});S.apps[id]=o;if(S.col)S.col.doc(id).set(o).catch(function(){})
  }catch(e){S.scan[id]=mcpErr(e);if(e&&(e.code==="server_not_connected"||e.code==="needs_reauth"||e.code==="approval_required"||e.code==="not_granted"))break}}
 S.busy=false;note("Scan finished. Review the suggestions below.","ok");render()}
init();
